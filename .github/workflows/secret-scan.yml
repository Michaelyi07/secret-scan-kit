# .github/workflows/secret-scan.yml — Member Space Platform · CI secret-leak gate
# ① Runs gitleaks on every PR (all commits in the current PR) and every push to main.
# ② A leak fails the job; the Job Summary shows ONLY file path, line number and
#    rule name — the secret content is never echoed (--redact + field-limited summary).
# ③ Weekly scheduled full-history scan, report stored as an artifact.

name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC — weekly full-history scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # full-history scan on large repos can exceed 10 min
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so PR-commit and weekly full scans work

      - name: Resolve scan range
        id: range
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # scan all commits in the current PR only.
            # use the PR head SHA: pull_request checkouts are on a detached HEAD,
            # so a branch name (github.head_ref) would not resolve here.
            echo "log_opts=--no-merges origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            # push to main / weekly schedule / manual: full history
            echo "log_opts=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run gitleaks (redacted)
        run: |
          set -eu
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gitleaks_8.21.2_linux_x64.tar.gz
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_checksums.txt -o /tmp/checksums.txt
          # verify the binary archive against the official checksums file before use
          grep 'gitleaks_8.21.2_linux_x64.tar.gz' /tmp/checksums.txt | sha256sum -c -
          tar -xzf /tmp/gitleaks_8.21.2_linux_x64.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --report-format json \
            --report-path leaks.json \
            --log-opts "${{ steps.range.outputs.log_opts }}"

      - name: Write Job Summary (path + line + rule only)
        if: failure()
        run: |
          python scripts/gitleaks_summary.py leaks.json "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

      - name: Upload scan report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.run_id }}-${{ github.event_name }}
          path: leaks.json
          if-no-files-found: ignore
          retention-days: 90
